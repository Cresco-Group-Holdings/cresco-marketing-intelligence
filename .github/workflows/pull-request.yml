name: Pull Request CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      run_database_tests:
        description: Run database integration tests
        type: boolean
        default: false
      run_build:
        description: Run production build
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_marketing?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cresco_marketing?schema=public
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  APP_URL: http://localhost:3000
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      prisma: ${{ steps.filter.outputs.prisma }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "src/**"
              - "tests/**"
              - "public/**"
              - "package.json"
              - "package-lock.json"
              - "tsconfig*.json"
              - "next.config.ts"
              - "postcss.config.*"
              - "eslint.config.*"
              - "prisma/**"
              - "scripts/**"
              - ".github/workflows/**"
            prisma:
              - "prisma/**"

  quality:
    name: Lint, typecheck, and validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:prisma
      - run: npm run validate:migrations
      - run: npm run validate:routes
      - run: npm run validate:vercel-cron
      - run: npm run validate:rls-security
      - run: npm run audit:secrets

  test:
    name: Unit and integration tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration

  database-tests:
    name: Database tests
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_database_tests) ||
      needs.changes.outputs.prisma == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'run-database-tests')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cresco_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:database

  build:
    name: Production build
    needs: [quality, test]
    if: |
      always() &&
      needs.quality.result == 'success' &&
      needs.test.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_build) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          (
            github.event.action == 'ready_for_review' ||
            contains(github.event.pull_request.labels.*.name, 'ci/build') ||
            contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci
