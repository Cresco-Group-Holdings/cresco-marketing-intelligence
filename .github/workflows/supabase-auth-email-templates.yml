name: Deploy Supabase Auth Email Templates

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_EMAIL_TEMPLATES to confirm"
        required: true
        type: string

concurrency:
  group: supabase-auth-email-templates
  cancel-in-progress: false

jobs:
  deploy-production-templates:
    name: Deploy confirmation email template to production Supabase
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.inputs.confirmation == 'DEPLOY_EMAIL_TEMPLATES' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Supabase deploy credentials
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in the production environment."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF is not configured in the production environment."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy auth email templates
        run: node scripts/deploy-supabase-auth-email-templates.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  reject-invalid-confirmation:
    name: Reject invalid confirmation phrase
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmation != 'DEPLOY_EMAIL_TEMPLATES' }}
    steps:
      - name: Fail workflow
        run: |
          echo "Confirmation phrase did not match. Expected exactly: DEPLOY_EMAIL_TEMPLATES"
          exit 1
