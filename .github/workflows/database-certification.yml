# Task 3 — Live Database Certification Workflow
#
# Runs read-only operational certification against staging and production databases.
# Requires GitHub environment secrets (no values printed in logs).
#
# Credential separation (canonical):
#   STAGING_CERTIFICATION_DATABASE_URL — staging live certification (read-only role recommended)
#   PRODUCTION_AUDIT_DATABASE_URL       — production read-only audit (must be read-only DB role)
#   RESTORE_VALIDATION_DATABASE_URL     — isolated restore target for recovery validation
#
# Legacy fallbacks (deprecated, migrate secrets to canonical names):
#   STAGING_DIRECT_URL, ANALYTICS_TEST_DATABASE_URL, PRODUCTION_DIRECT_URL
#
# Production migration credentials (PRODUCTION_DIRECT_URL) belong ONLY in
# production-database-migrate.yml — not in this workflow.

name: Database Certification

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CERTIFY_DATABASE to run live certification"
        required: true
        type: string
      run_staging:
        description: "Run staging live certification"
        required: false
        type: boolean
        default: true
      run_production:
        description: "Run production read-only certification"
        required: false
        type: boolean
        default: true
      run_restore:
        description: "Run restore validation (requires RESTORE_VALIDATION_DATABASE_URL)"
        required: false
        type: boolean
        default: false

concurrency:
  group: database-certification
  cancel-in-progress: false

jobs:
  reject-invalid:
    name: Reject invalid confirmation
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmation != 'CERTIFY_DATABASE' }}
    steps:
      - run: |
          echo "Confirmation phrase did not match. Expected exactly: CERTIFY_DATABASE"
          exit 1

  ci-database-certification:
    name: CI database certification (Postgres 16)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmation == 'CERTIFY_DATABASE' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cresco_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run validate:migrations
      - run: npm run validate:rls-security
      - run: npx prisma migrate deploy
      - run: node scripts/run-database-certification.mjs --target ci
      - run: npm run test:database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-database-certification
          path: artifacts/database-certification/

  staging-live-certification:
    name: Staging live certification
    runs-on: ubuntu-latest
    needs: [ci-database-certification]
    environment: staging-certification
    if: ${{ github.event.inputs.confirmation == 'CERTIFY_DATABASE' && github.event.inputs.run_staging == true }}
    env:
      STAGING_CERTIFICATION_DATABASE_URL: ${{ secrets.STAGING_CERTIFICATION_DATABASE_URL || secrets.STAGING_DIRECT_URL || secrets.ANALYTICS_TEST_DATABASE_URL }}
      STAGING_DIRECT_URL: ${{ secrets.STAGING_CERTIFICATION_DATABASE_URL || secrets.STAGING_DIRECT_URL || secrets.ANALYTICS_TEST_DATABASE_URL }}
      ANALYTICS_TEST_DATABASE_URL: ${{ secrets.STAGING_CERTIFICATION_DATABASE_URL || secrets.STAGING_DIRECT_URL || secrets.ANALYTICS_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify staging database URL configured
        run: |
          if [ -z "${STAGING_CERTIFICATION_DATABASE_URL:-}" ]; then
            echo "STAGING_CERTIFICATION_DATABASE_URL (or legacy STAGING_DIRECT_URL) must be configured in staging-certification environment."
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/run-database-certification.mjs --target staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-database-certification
          path: artifacts/database-certification/

  production-readonly-certification:
    name: Production read-only certification
    runs-on: ubuntu-latest
    needs: [ci-database-certification]
    environment: production-audit
    if: ${{ github.event.inputs.confirmation == 'CERTIFY_DATABASE' && github.event.inputs.run_production == true }}
    env:
      PRODUCTION_AUDIT_DATABASE_URL: ${{ secrets.PRODUCTION_AUDIT_DATABASE_URL || secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify production audit database URL configured
        run: |
          if [ -z "${PRODUCTION_AUDIT_DATABASE_URL:-}" ]; then
            echo "PRODUCTION_AUDIT_DATABASE_URL must be configured in production-audit environment."
            echo "Use a read-only database role — not the migration owner credential."
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - name: Production migration state (read-only)
        run: node scripts/verify-production-migration.mjs
        env:
          DATABASE_URL: ${{ env.PRODUCTION_AUDIT_DATABASE_URL }}
          DIRECT_URL: ${{ env.PRODUCTION_AUDIT_DATABASE_URL }}
      - run: node scripts/run-database-certification.mjs --target production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-database-certification
          path: artifacts/database-certification/

  restore-validation:
    name: Restore validation (isolated target)
    runs-on: ubuntu-latest
    needs: [staging-live-certification]
    environment: restore-validation
    if: ${{ github.event.inputs.confirmation == 'CERTIFY_DATABASE' && github.event.inputs.run_restore == true }}
    env:
      RESTORE_VALIDATION_DATABASE_URL: ${{ secrets.RESTORE_VALIDATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify restore validation URL configured
        run: |
          if [ -z "${RESTORE_VALIDATION_DATABASE_URL:-}" ]; then
            echo "RESTORE_VALIDATION_DATABASE_URL must be configured in restore-validation environment."
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/run-database-certification.mjs --target restored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-database-certification
          path: artifacts/database-certification/

  certification-summary:
    name: Certification phase summary
    runs-on: ubuntu-latest
    needs:
      - ci-database-certification
      - staging-live-certification
      - production-readonly-certification
      - restore-validation
    if: ${{ always() && github.event.inputs.confirmation == 'CERTIFY_DATABASE' }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "*-database-certification"
          path: artifacts/
          merge-multiple: true
      - name: Print phase matrix
        run: |
          echo "## Database Certification Phase Matrix"
          echo ""
          for artifact in ci staging production restored; do
            file="artifacts/${artifact}-certification.json"
            if [ -f "$file" ]; then
              echo "### ${artifact}"
              node -e "
                const r = require('./${file}');
                for (const [k,v] of Object.entries(r.phaseMatrix ?? {})) {
                  console.log('| ' + k + ' | ' + v + ' |');
                }
              "
              echo ""
            else
              echo "### ${artifact}: NOT CERTIFIED (artifact missing)"
              echo ""
            fi
          done
          echo "| Phase | staging | production | restore |"
          echo "|---|---|---|---|"
          echo "| staging baseline | see artifact | NOT REQUESTED | see artifact |"
          echo "| production baseline | NOT REQUESTED | see artifact | NOT REQUESTED |"
          echo ""
          echo "Missing credentials or skipped jobs produce NOT CERTIFIED — not a green pass."
