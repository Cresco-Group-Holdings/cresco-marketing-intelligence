name: Social Analytics Scheduler

on:
  schedule:
    # Every six hours, matching the SOCIAL_ANALYTICS_SYNC_INTERVAL_MINUTES default of 360.
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum analytics syncs to drain in this run
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: social-analytics-scheduler
  cancel-in-progress: true

jobs:
  scheduler:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - name: Enqueue and drain social analytics syncs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PUBLISHING_WORKER_TOKEN: ${{ secrets.PUBLISHING_WORKER_TOKEN }}
          SOCIAL_ANALYTICS_WORKER_BATCH: ${{ github.event.inputs.limit || '10' }}
        run: |
          if [ -z "${APP_URL:-}" ] || [ -z "${PUBLISHING_WORKER_TOKEN:-}" ]; then
            echo "::warning::APP_URL and PUBLISHING_WORKER_TOKEN are not configured in the production environment. Skipping scheduler run."
            exit 0
          fi
          base_url="${APP_URL%/}/api/social-analytics-sync/schedule"
          if [ -n "${SOCIAL_ANALYTICS_WORKER_BATCH:-}" ]; then
            url="${base_url}?limit=${SOCIAL_ANALYTICS_WORKER_BATCH}"
          else
            url="${base_url}"
          fi
          curl --fail-with-body -sS -X POST "$url" \
            -H "authorization: Bearer ${PUBLISHING_WORKER_TOKEN}" \
            -H "content-type: application/json"
