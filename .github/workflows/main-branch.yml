name: Main Branch CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_marketing?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cresco_marketing?schema=public
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  APP_URL: http://localhost:3000
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      prisma: ${{ steps.filter.outputs.prisma }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            prisma:
              - "prisma/**"

  quality:
    name: Lint, typecheck, and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:prisma
      - run: npm run validate:migrations
      - run: npm run validate:routes
      - run: npm run validate:vercel-cron
      - run: npm run audit:secrets

  test:
    name: Unit and integration tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration

  database-tests:
    name: Database tests
    needs: changes
    if: needs.changes.outputs.prisma == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cresco_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cresco_analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:database

  build:
    name: Production build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci
